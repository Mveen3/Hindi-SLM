# ============================================================
# Training Configuration — Hindi (Model H)
# ============================================================
# Designed for RTX 3050 (4 GB VRAM) with mixed-precision (AMP).
# Effective batch size = batch_size × gradient_accumulation_steps
#                      = 32 × 4 = 128 sequences per optimizer step.
# ============================================================

# Data
train_data: "data/processed/train.jsonl"
val_data: "data/processed/val.jsonl"
test_data: "data/processed/test.jsonl"
tokenizer_path: "tokenizer/tokenizer.json"

# Batching
batch_size: 8
gradient_accumulation_steps: 16
num_workers: 2

# Optimizer — AdamW
optimizer: "adamw"
learning_rate: 3.0e-4
weight_decay: 0.01
betas: [0.9, 0.95]
eps: 1.0e-8
max_grad_norm: 1.0

# Learning rate schedule — cosine with linear warmup
lr_scheduler: "cosine"
warmup_steps: 2000

# Training duration
max_steps: 100000
eval_interval: 1000
log_interval: 100
save_interval: 5000

# Mixed precision
use_amp: true

# Checkpointing
checkpoint_dir: "checkpoints"
resume_from: "latest"     # "latest" auto-finds most recent checkpoint; or provide a path

# Logging
log_dir: "logs_pretraining"

# Reproducibility
seed: 42
